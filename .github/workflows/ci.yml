# 테스트·빌드 확인: 모든 브랜치 push 와 PR 마다 npm test + npm run build
# 저장소 Settings → Branches(또는 Rulesets) 에서 'CI / test' 를 필수 검사로 지정하면 실패한 변경은 합칠 수 없음 (docs/DEPLOY.md)
# Actions 탭에서 직접 실행(Run workflow)하면 브라우저 연기 시험(smoke)도 함께 돎
name: CI

on:
  push:
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 새로 올리면 앞의 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 액션은 커밋 해시로 고정 (deploy-relay.yml 과 같은 버전). 주석은 해당 버전
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # npm ci 의 설치 스크립트가 .git/config 의 GITHUB_TOKEN 을 읽지 못하게
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 단위 테스트 (node --test)
        run: npm test
      - name: 빌드 (vite build + 모델 압축)
        run: npm run build

  # 생성물 검사 (tests/gen/*.check.mjs): 문서 표·아이콘 범위처럼 다시 만들어야 하는 것. 실패해도 CI 는 통과 (표시만)
  gen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:gen

  # 브라우저 연기 시험: 직접 실행할 때만 (소프트웨어 WebGL 이라 몇 분 걸림, 합치기를 막지 않음)
  smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 빌드 (릴레이 서버 주소 없이)
        run: npm run build
        env:
          VITE_WS_URL: ''
      - name: Playwright 설치 (package.json 은 그대로)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 연기 시험
        run: npm run smoke
