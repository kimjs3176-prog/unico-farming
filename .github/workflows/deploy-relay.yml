# Cloudflare 릴레이 서버 자동 배포
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers 편집 권한), CLOUDFLARE_ACCOUNT_ID
# deploy/cloudflare 가 바뀌어 기본 브랜치에 올라오거나, Actions 탭에서 직접 실행하면 배포
name: Deploy relay (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['deploy/cloudflare/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        working-directory: deploy/cloudflare
        run: npm ci
      - name: Deploy
        working-directory: deploy/cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
