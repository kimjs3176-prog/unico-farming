# Cloudflare 릴레이 서버 자동 배포
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers 편집 권한), CLOUDFLARE_ACCOUNT_ID
# deploy/cloudflare 가 바뀌어 기본 브랜치에 올라오거나, Actions 탭에서 직접 실행하면 배포
name: Deploy relay (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['deploy/cloudflare/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 액션은 커밋 해시로 고정 (태그가 옮겨져도 다른 코드가 배포 토큰 옆에서 돌지 않게). 주석은 해당 버전
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # npm ci 의 설치 스크립트가 .git/config 의 GITHUB_TOKEN 을 읽지 못하게
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install wrangler
        working-directory: deploy/cloudflare
        run: npm ci
      - name: Deploy
        working-directory: deploy/cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
