<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>유니코 팜 - 농업 메타버스</title>
  <meta name="description" content="한국농업기술진흥원 마스코트 유니코와 함께하는 캐주얼 3D 농장 메타버스" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦄</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/ui/style.css" />
  <link rel="stylesheet" href="/src/ui/theme.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="loading">
    <div class="sky-deco"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="hill h1"></i><i class="hill h2"></i></div>
    <div class="loading-card">
      <div class="loading-logo">🦄</div>
      <h1>유니코 팜</h1>
      <p class="tagline">한국농업기술진흥원과 함께하는 농업 메타버스</p>
      <div class="feature-row"><span>🌾 논농사</span><span>🎣 낚시</span><span>🚜 트랙터</span><span>📡 스마트팜</span><span>🏢 KOAT 체험관</span></div>
      <p id="loading-text">농장 준비 중…</p>
      <div class="bar"><div id="loading-bar"></div></div>
      <label class="name-row">닉네임 <input id="nickname" maxlength="12" placeholder="유니코" /></label>
      <button id="start-btn" disabled>입장하기</button>
      <p class="hint"><a href="./pixel.html" style="color:inherit;font-weight:bold">🎮 도트(2.5D) 버전으로 하기 →</a></p>
      <p class="hint">키보드: WASD/방향키 이동 · E 상호작용<br/>마우스·터치: 클릭/탭으로 이동·상호작용 · 드래그로 시점 · 휠/두 손가락 줌</p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
